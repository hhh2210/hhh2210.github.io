<article class="archive-row">
  <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: "%-d %b %Y" }}</time>
  <div class="archive-row__main">
    <h3 class="archive-row__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    {% if include.show_excerpt %}
    <div class="archive-row__excerpt">{{ include.post.excerpt }}</div>
    {% endif %}
  </div>
</article>
