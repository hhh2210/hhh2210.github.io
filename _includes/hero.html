{% comment %}Text comes from the front matter of index.md (mission, name_caption, bio).{% endcomment %}
<div class="hero">
  <h1 class="mission">{{ page.mission }}</h1>
  <div class="identity">
    <img class="avatar" src="{{ '/images/personal.png' | relative_url }}" width="64" height="64" alt="Zhuoyuan Hao (Larry Hao)">
    <div class="bio">
      <p class="bio-lead">I am <span class="who-name">{{ site.data.research.person.name }}</span> <span class="who-caption">({{ page.name_caption }})</span>.</p>
      {{ page.bio | markdownify }}
      <p class="contact inline-links">
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a rel="me" href="https://scholar.google.com/citations?user={{ site.footer-links.googlescholar }}">Google Scholar</a>
        <a rel="me" href="https://github.com/{{ site.footer-links.github }}">GitHub</a>
        <a rel="me" href="https://x.com/{{ site.footer-links.twitter }}">X</a>
        <a href="{{ '/assets/files/resume-en.pdf' | relative_url }}">CV</a>
        <a href="mailto:{{ site.footer-links.email }}">Email</a>
      </p>
    </div>
  </div>
</div>
